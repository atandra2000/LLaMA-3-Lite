[project]
name = "llama3lite-explainer-v2"
version = "0.1.0"
description = "Motion-graphics explainer video for the LLaMA-3-Lite architecture"
requires-python = ">=3.12,<3.13"
dependencies = [
    "manim>=0.19.0",
    "edge-tts>=7.0.0",
    "typst>=0.13.0",
    "numpy<3",
    "tokenizers>=0.20",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
